<!DOCTYPE html>
<html lang="{{ site.lang | default: 'zh-cn' }}">
<head>
  <meta charset="UTF-8">
  {% seo %}
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="{{ '/assets/css/blog.css' | relative_url }}">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📝</text></svg>">
</head>
<body>
  <div class="container">
    <!-- 顶部导航 -->
    <nav class="navbar">
      <div class="navbar-brand">
        <a href="{{ '/' | relative_url }}">{{ site.title }}</a>
        <button class="theme-toggle" id="themeToggle">🌙</button>
      </div>
      <ul class="navbar-links">
        <li><a href="{{ '/' | relative_url }}">首页</a></li>
        <li><a href="{{ '/archive' | relative_url }}">归档</a></li>
        <li><a href="{{ '/about' | relative_url }}">关于</a></li>
      </ul>
      <div class="navbar-toggle" id="navbarToggle">
        <span></span>
        <span></span>
        <span></span>
      </div>
    </nav>

    <!-- 主要内容区 -->
    <main class="content">
      <div class="content-header">
        <h1>{{ page.title }}</h1>
      </div>
      
      <!-- 文章列表将在这里渲染 -->
      {{ content }}
    </main>

    <!-- 页脚 -->
    <footer class="footer">
      <div class="footer-content">
        <div class="footer-links">
          <a href="https://github.com/{{ site.github_username }}" target="_blank">
            GitHub
          </a>
        </div>
        <p class="copyright">Copyright &copy; 2025 Kkskagvid. All Rights Reserved.</p>
      </div>
    </footer>
  </div>
  
</body>
</html>
